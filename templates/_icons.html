{% macro icon(name, class_name='icon', title='') -%}
<svg class="{{ class_name }}" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"{% if title %} role="img" aria-label="{{ title }}"{% endif %}>
  {%- if name == 'pulse' -%}
  <path d="M1.5 8h3l1.4-3.5 2.2 7 1.8-4H14.5" />
  {%- elif name == 'shield-check' -%}
  <path d="M8 1.6 13 3.6v3.8c0 3.2-2.1 5.8-5 6.9-2.9-1.1-5-3.7-5-6.9V3.6L8 1.6Z" />
  <path d="m5.8 8.2 1.4 1.4 3-3.2" />
  {%- elif name == 'shield-alert' -%}
  <path d="M8 1.6 13 3.6v3.8c0 3.2-2.1 5.8-5 6.9-2.9-1.1-5-3.7-5-6.9V3.6L8 1.6Z" />
  <path d="M8 5.1v3.1" />
  <path d="M8 10.6h0" />
  {%- elif name == 'upload' -%}
  <path d="M8 10.8V3.8" />
  <path d="m5.4 6.1 2.6-2.6 2.6 2.6" />
  <path d="M3.8 10.9v1.7h8.4v-1.7" />
  {%- elif name == 'mail' -%}
  <path d="M2.5 4.2h11v7.6h-11z" />
  <path d="m2.8 4.5 5.2 4 5.2-4" />
  {%- elif name == 'chevron' -%}
  <path d="m5.5 3.8 4.9 4.2-4.9 4.2" />
  {%- elif name == 'power' -%}
  <path d="M8 2.3v4.1" />
  <path d="M5.1 4.1a5 5 0 1 0 5.8 0" />
  {%- endif -%}
</svg>
{%- endmacro %}
